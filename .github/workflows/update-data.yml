name: Update RSS Data

on:
  schedule:
    - cron: "23 15 * * *" # 한국 시간 기준 매일 00시 23분 실행 (UTC 15시 23분)
  workflow_dispatch: # 수동 실행 옵션

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch RSS feeds
        run: node scripts/fetch-rss.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/all.json public/data/latest.json
          git commit -m "chore: auto-update news and latest data" || exit 0
          git push
