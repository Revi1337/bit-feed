openapi: 3.0.3
info:
  title: bit-feed Open API
  description: IT 뉴스 통합 뷰어(bit-feed)의 최신 소식 및 아카이브 데이터 조회를 위한 RESTful API 명세서입니다.
  version: 1.0.0
servers:
  - url: 'https://feed.revi1337.com/api'
    description: Production Server
  - url: 'http://localhost:3000/api'
    description: Local Development Server
paths:
  /:
    get:
      summary: OpenAPI 명세 조회
      description: bit-feed API의 OpenAPI 3.0 명세를 YAML 형식으로 반환합니다.
      operationId: getOpenApi
      responses:
        '200':
          description: OpenAPI 명세 반환
          content:
            application/yaml:
              schema:
                type: string
  /feeds/categories:
    get:
      summary: 카테고리 목록 조회
      description: bit-feed에서 수집하는 모든 고유 카테고리 목록을 배열로 반환합니다.
      operationId: getCategories
      responses:
        '200':
          description: 성공적인 카테고리 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringArrayResponse'
  /feeds/sources:
    get:
      summary: 출처(블로그) 목록 조회
      description: bit-feed에서 수집 대상으로 삼고 있는 모든 고유 출처(sourceName) 목록을 반환합니다.
      operationId: getSources
      responses:
        '200':
          description: 성공적인 출처 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StringArrayResponse'
  /feeds/latest:
    get:
      summary: 당일 최신 뉴스 조회
      description: 가장 최근에 수집되어 업데이트된 당일 기사 원본 배열을 반환합니다.
      operationId: getLatestFeeds
      responses:
        '200':
          description: 성공적인 최신 뉴스 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArticleArrayResponse'
  /feeds:
    get:
      summary: 전체 뉴스 검색 및 조회
      description: 전체 누적 아카이브 데이터를 기반으로 검색, 필터링, 페이지네이션 기능을 제공합니다.
      operationId: getFeeds
      parameters:
        - name: page
          in: query
          description: 조회할 페이지 번호 (기본값 1)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: 한 페이지당 반환할 아이템 수 (기본값 20)
          schema:
            type: integer
            default: 20
        - name: category
          in: query
          description: 특정 카테고리로 필터링 (예 프론트엔드, 인공지능)
          schema:
            type: string
        - name: source
          in: query
          description: 특정 출처로 필터링 (예 React Blog)
          schema:
            type: string
        - name: q
          in: query
          description: 제목 또는 요약문에 포함된 키워드 검색
          schema:
            type: string
        - name: from
          in: query
          description: 조회 시작일 (ISO8601, 예 2026-06-01)
          schema:
            type: string
            format: date
        - name: to
          in: query
          description: 조회 종료일 (ISO8601, 예 2026-06-30)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 성공적인 검색 결과 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedArticleResponse'
components:
  schemas:
    Article:
      type: object
      properties:
        id:
          type: string
          description: 기사 고유 식별자 (보통 원본 URL 또는 커스텀 스크래퍼가 생성한 고유 키)
        title:
          type: string
          description: 기사 제목
        summary:
          type: string
          description: 기사 원문 앞부분 발췌 (최대 200자)
        aiSummary:
          type: string
          description: Gemini API를 통해 생성된 한국어 AI 요약. 분량에 따라 동적으로 길이 조절됨
        category:
          type: string
          description: 기사가 속한 대분류 카테고리 (예 인공지능, IDE & 개발 도구, 프론트엔드 등)
        source:
          type: string
          description: 기사 출처 (피드 이름 또는 스크래퍼 소스명)
        author:
          type: string
          description: 기사 작성자
        pubDate:
          type: string
          format: date-time
          description: 발행 일시 (ISO 8601 포맷)
        fetchedAt:
          type: string
          format: date-time
          description: 파이프라인이 기사를 수집한 시각 (ISO 8601 포맷)
        url:
          type: string
          description: 기사 원본 링크 URL
        tags:
          type: array
          items:
            type: string
          description: 기사에 포함된 태그 목록
    StringArrayResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: string
    ArticleArrayResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Article'
    PaginatedArticleResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        meta:
          type: object
          properties:
            total:
              type: integer
              description: 검색 조건에 일치하는 전체 아이템 수
            page:
              type: integer
              description: 현재 페이지 번호
            limit:
              type: integer
              description: 페이지당 반환 개수
            totalPages:
              type: integer
              description: 전체 페이지 수
        data:
          type: array
          items:
            $ref: '#/components/schemas/Article'
